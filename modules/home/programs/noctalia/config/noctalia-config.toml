[backdrop]
enabled = true
tint_intensity = 0.24999999441206455

[bar.default]
background_opacity = 0.5
center = [ "workspaces" ]
contact_shadow = true
end = [ "tray", "notifications", "caffeine", "clipboard", "network", "volume", "brightness", "battery" ]
margin_ends = 10.0
radius = 20
start = [ "clock", "date", "wallpaper", "media" ]
widget_spacing = 20

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = true
    timeout = 900

[nightlight]
enabled = true

[notification]
background_opacity = 0.4999999888241291
layer = "overlay"
offset_x = 10.0
offset_y = 10.0

[osd]
background_opacity = 0.4999999888241291
offset_y = 10.0
position = "bottom_center"

[shell]
avatar_path = "/home/sabisho/nixdots/modules/home/programs/noctalia/config/Rusty-Friend.png"
font_family = "Inter Display"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = false

    [shell.panel]
    transparency_mode = "glass"

[system.monitor]
enabled = false

[theme]
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "zen-browser", "yazi" ]

[wallpaper]
directory = "/home/sabisho/nixdots/Wallpapers"

    [wallpaper.default]
    path = "/home/sabisho/nixdots/Wallpapers/Japan.jpg"

    [wallpaper.last]
    path = "/home/sabisho/nixdots/Wallpapers/Japan.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/sabisho/nixdots/Wallpapers/Japan.jpg"

    [[wallpaper.favorite]]
    path = "/home/sabisho/nixdots/Wallpapers/Japan.jpg"
    theme_mode = "auto"

[weather]
address = "Delhi,India"
auto_locate = true
refresh_minutes = 60

[widget.battery]
display_mode = "graphic"

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.workspaces]
display = "none"
