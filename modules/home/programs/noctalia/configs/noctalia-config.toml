[backdrop]
enabled = true

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.4999999888241291
    center = [ "workspaces" ]
    end = [ "tray", "notifications", "caffeine", "clipboard", "network", "volume", "brightness", "battery" ]
    margin_ends = 10
    radius = 20
    start = [ "clock", "date", "wallpaper", "media" ]
    widget_spacing = 20

[control_center]
show_shortcut_labels = false

[dock]
background_opacity = 0.4999999888241291

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.4999999888241291

[osd]
background_opacity = 0.4999999888241291
position = "bottom_center"

[shell]
corner_radius_scale = 2.0
font_family = "Adwaita Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false

    [shell.panel]
    transparency_mode = "glass"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "zen-browser", "heroiclauncher", "lazygit", "yazi" ]

[wallpaper]
directory = "/home/sabisho/nixdots/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/sabisho/nixdots/Wallpapers/Specs_Woman.jpg"

    [wallpaper.last]
    path = "/home/sabisho/nixdots/Wallpapers/Specs_Woman.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/sabisho/nixdots/Wallpapers/Specs_Woman.jpg"

[widget.tray]
drawer = true

[widget.workspaces]
show_labels = false
