[backdrop]
enabled = true
tint_intensity = 0.24999999441206455

[bar.default]
background_opacity = 0.5
center = [ "workspaces" ]
contact_shadow = true
end = [ "tray", "notifications", "caffeine", "clipboard", "network", "volume", "brightness", "battery" ]
margin_ends = 10.0
radius = 20
start = [ "clock", "date", "wallpaper", "media" ]
widget_spacing = 20

[desktop_widgets]
enabled = false
schema_version = 1
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.5

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = true
    timeout = 900

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [ "lockscreen-widget-0000000000000001", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 24
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 997.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 544.0
    box_width = 1920.0
    cx = 960.0
    cy = 268.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        color = "on_surface"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 120.0
    box_width = 576.0
    cx = 952.0
    cy = 600.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        color = "on_surface"

[nightlight]
enabled = true

[notification]
background_opacity = 0.4999999888241291
layer = "overlay"
offset_x = 10.0
offset_y = 10.0

[osd]
background_opacity = 0.4999999888241291
lock_keys = false
offset_y = 10.0
position = "bottom_center"

[plugins]
enabled = []

[shell]
app_icon_color = "secondary"
avatar_path = "/home/sabisho/nixdots/modules/home/programs/noctalia/configs/Rusty-Friend.png"
corner_radius_scale = 2.0
font_family = "Adwaita Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = false

    [shell.panel]
    launcher_categories = false
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/sabisho/Pictures/Screenshots"

[system.monitor]
enabled = false

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "zen-browser", "yazi" ]

[wallpaper]
directory = "/home/sabisho/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/sabisho/Pictures/Wallpapers/ign-waifu.png"

    [wallpaper.last]
    path = "/home/sabisho/Pictures/Wallpapers/ign-waifu.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/sabisho/Pictures/Wallpapers/ign-waifu.png"

    [[wallpaper.favorite]]
    path = "/home/sabisho/nixdots/Wallpapers/Japan.jpg"
    theme_mode = "auto"

[weather]
address = "Delhi,India"
auto_locate = true
refresh_minutes = 60

[widget.battery]
display_mode = "graphic"

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%I:%M %p}"

[widget.tray]
drawer = true

[widget.workspaces]
display = "none"
